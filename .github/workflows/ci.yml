name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: whoop_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: whoop_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U whoop_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WHOOP_TEST_DATABASE_URL: postgres://whoop_test:test_only@localhost:5432/whoop_test?sslmode=disable
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./cmd/... ./internal/...

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Preparar banco de testes isolado
        run: |
          psql "$WHOOP_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000001_init_schema.up.sql
          psql "$WHOOP_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000002_sync_status.up.sql
          psql "$WHOOP_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000003_cycle_steps.up.sql

      - name: Testes unitários e de integração
        run: go test -p 1 -race -count=1 ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./web/package-lock.json"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Testes do frontend
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
