info:
  contact: {}
paths:
  /api/v1/cycles:
    get:
      consumes:
      - application/json
      description: Fetches cycles using cursor-based pagination
      parameters:
      - description: Data inicial em Brasília (AAAA-MM-DD)
        in: query
        name: start
        required: true
        type: string
      - description: Data final inclusiva em Brasília (AAAA-MM-DD)
        in: query
        name: end
        required: true
        type: string
      - description: Cursor opaco da página anterior
        in: query
        name: cursor
        type: string
      - description: Number of records (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.CyclesPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get cycles
      tags:
      - cycles
  /api/v1/insights:
    get:
      consumes:
      - application/json
      description: Fetches daily strain and recovery from continuous aggregates for
        the last 30 days
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get insights
      tags:
      - insights
  /api/v1/recoveries:
