        name: cursor
        type: string
      - description: Number of records (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.RecoveriesPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recoveries
      tags:
      - recoveries
  /api/v1/sleeps:
    get:
      consumes:
      - application/json
      description: Fetches sleeps using cursor-based pagination
      parameters:
      - description: Data inicial em Brasília (AAAA-MM-DD)
        in: query
        name: start
        required: true
        type: string
      - description: Data final inclusiva em Brasília (AAAA-MM-DD)
        in: query
        name: end
        required: true
        type: string
      - description: Cursor opaco da página anterior
        in: query
        name: cursor
        type: string
      - description: Number of records (default 50, max 200)
        in: query
